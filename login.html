  <nav class="site">

<main><div class="wrap">
  <h2>로그인</h2>
  <div class="auth-form" style="max-width: 400px; margin: 30px 0;">
    <input type="email" id="email" placeholder="이메일" style="width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); font-family: inherit;">
    <input type="password" id="password" placeholder="비밀번호" style="width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); font-family: inherit;">

    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
      <button id="signup" style="flex: 1; padding: 12px; background: var(--accent2); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: .2s;" onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='1'">가입</button>
      <button id="login" style="flex: 1; padding: 12px; background: var(--accent); color: var(--accent-ink); border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: .2s;" onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='1'">로그인</button>
      <button id="logout" style="flex: 1; padding: 12px; background: var(--line); color: var(--ink); border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: .2s;" onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='1'">로그아웃</button>
    </div>

    <p style="margin: 0 0 12px; font-size: 13px;"><a href="#" id="forgot-link" style="color: var(--sub);">비밀번호를 잊으셨나요?</a></p>

    <p style="margin: 0 0 20px; font-size: 12px; color: var(--sub);">도서관이나 학교처럼 같이 쓰는 컴퓨터에서는, GOAT상점을 다 보신 뒤 로그아웃을 눌러 주세요.</p>

    <div id="message" style="padding: 12px; border-radius: 8px; background: var(--card); color: var(--sub); text-align: center; min-height: 20px;"></div>
  </div>
</div></main>

<footer class="site"><div class="wrap"></div></footer>
<script src="assets/shop.js"></script>
<script src="assets/app.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, sendEmailVerification, sendPasswordResetEmail, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyADMQa2y2lWp3Fr4huFU5MZYOK6w94xCHs",
    authDomain: "goat-shop-1e768.firebaseapp.com",
    projectId: "goat-shop-1e768",
    storageBucket: "goat-shop-1e768.firebasestorage.app",
    messagingSenderId: "1069398250098",
    appId: "1:1069398250098:web:c375cf80eaf41f512a68eb"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const messageEl = document.getElementById("message");
  const emailEl = document.getElementById("email");
  const passwordEl = document.getElementById("password");

  let afterDelay = 1000;

  function goAfterLogin() {
    let dest = "mypage.html";
    const want = new URLSearchParams(location.search).get("redirect");
    try {
      const u = new URL(want, location.origin);
      if (want && u.origin === location.origin) dest = u.pathname + u.search;
    } catch (e) {}
    setTimeout(() => { location.href = dest; }, afterDelay);
  }

  document.getElementById("signup").addEventListener("click", async () => {
    const email = emailEl.value;
    const password = passwordEl.value;

    if (!email || !password) {
      messageEl.textContent = "이메일과 비밀번호를 입력해주세요";
      return;
    }

    try {
      const result = await createUserWithEmailAndPassword(auth, email, password);
      try {
        await sendEmailVerification(result.user);
        messageEl.textContent = "인증 메일을 보냈습니다. 메일함과 스팸함을 확인해 주세요.";
      } catch (mailError) {
        messageEl.textContent = `가입은 됐지만 인증 메일을 보내지 못했습니다: ${mailError.code}`;
      }
      afterDelay = 3000;

      window.dataLayer = window.dataLayer || [];
      dataLayer.push({ ecommerce: null });
      dataLayer.push({
        event: "sign_up",
        method: "email"
      });

      emailEl.value = "";
      passwordEl.value = "";

      goAfterLogin();
    } catch (error) {
      messageEl.textContent = error.code;
    }
  });

  document.getElementById("forgot-link").addEventListener("click", async (e) => {
    e.preventDefault();
    const email = emailEl.value.trim();

    if (!email) {
      messageEl.textContent = "위 이메일 칸에 주소를 입력한 뒤 다시 눌러 주세요.";
      return;
    }

    try {
      await sendPasswordResetEmail(auth, email);
    } catch (error) {
      if (error.code !== "auth/user-not-found") {
        messageEl.textContent = error.code;
        return;
      }
    }
    messageEl.textContent = "메일을 보냈습니다. 가입된 주소라면 곧 도착합니다.";
  });

  document.getElementById("login").addEventListener("click", async () => {
    const email = emailEl.value;
    const password = passwordEl.value;

    if (!email || !password) {
      messageEl.textContent = "이메일과 비밀번호를 입력해주세요";
      return;
    }

    try {
      const result = await signInWithEmailAndPassword(auth, email, password);
      messageEl.textContent = `로그인됨: ${result.user.email}`;
      emailEl.value = "";
      passwordEl.value = "";

      goAfterLogin();
    } catch (error) {
      messageEl.textContent = error.code;
    }
  });

  document.getElementById("logout").addEventListener("click", async () => {
    try {
      await signOut(auth);
      messageEl.textContent = "로그아웃됨";
      emailEl.value = "";
      passwordEl.value = "";
    } catch (error) {
      messageEl.textContent = error.code;
    }
  });
</script>
</body>
</html>
