<header class="site"><div class="wrap">
  <a class="brand" href="index.html">GOAT상점</a>
  <nav class="site">
    <a href="index.html">상품</a>
    <a href="about.html">가게 소개</a>
    <a href="shipping.html">배송·교환</a>
    <a href="cart.html">장바구니<span class="cart-count">0</span></a>

<main><div class="wrap">
  <h2>마이페이지</h2>
  <div id="loading" style="padding: 40px; text-align: center; color: var(--sub);">확인 중...</div>
  <div id="content" style="display: none; max-width: 400px;">
    <p id="email-display" style="padding: 20px; background: var(--card); border-radius: 8px; margin-bottom: 20px;"></p>
    <div id="verify-box" style="display: none; margin-bottom: 20px;">
      <p id="verify-note" style="margin: 0 0 12px; color: var(--sub);">이메일 인증이 아직 안 됐습니다. 메일함과 스팸함에서 인증 링크를 눌러 주세요.</p>
      <button id="resend-btn" style="width: 100%; padding: 12px; background: var(--accent); color: var(--accent-ink); border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">인증 메일 다시 보내기</button>
      <p id="resend-msg" style="margin: 12px 0 0; color: var(--sub);"></p>
    </div>
    <div id="google-link-box" style="margin-bottom: 20px;">
      <button id="google-link-btn" style="width: 100%; padding: 12px; background: white; color: #1f1f1f; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">Google 계정 연결하기</button>
      <p id="google-linked" style="display: none; margin: 0; padding: 12px; background: var(--card); border-radius: 8px; color: var(--sub); text-align: center;">연결됨</p>
      <p id="google-link-msg" style="margin: 12px 0 0; color: var(--sub);"></p>
    </div>
    <div id="orders-box" style="margin-bottom: 20px;">
      <h3 style="margin: 0 0 12px;">내 주문</h3>
      <div id="my-orders"></div>
      <p id="orders-stopped" style="display: none; margin: 4px 0 0; font-size: 13px; color: var(--sub);">모든 주문이 끝나 실시간 확인을 멈췄습니다. 새로 고치면 다시 확인합니다. <button id="orders-refresh" style="margin-left: 8px; padding: 4px 12px; background: var(--line); color: var(--ink); border: none; border-radius: 6px; cursor: pointer; font: inherit;">다시 확인</button></p>
    </div>
    <button id="logout-btn" style="width: 100%; padding: 12px; background: var(--line); color: var(--ink); border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">로그아웃</button>
  </div>
</div></main>

<footer class="site"><div class="wrap"></div></footer>
<script src="assets/shop.js"></script>
<script src="assets/app.js"></script>
<script type="module">
  import { signOut, sendEmailVerification, GoogleAuthProvider, linkWithPopup } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
  import { getFirestore, collection, query, where, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  const auth = window.authStateManager.getCurrentAuth();
  const loadingEl = document.getElementById("loading");
  const contentEl = document.getElementById("content");
  const emailDisplayEl = document.getElementById("email-display");
  const logoutBtnEl = document.getElementById("logout-btn");
  const verifyBoxEl = document.getElementById("verify-box");
  const resendBtnEl = document.getElementById("resend-btn");
  const resendMsgEl = document.getElementById("resend-msg");

  resendBtnEl.addEventListener("click", async () => {
    resendMsgEl.textContent = "";
    resendBtnEl.disabled = true;
    try {
      await sendEmailVerification(auth.currentUser);
      resendMsgEl.textContent = "인증 메일을 다시 보냈습니다. 메일함과 스팸함을 확인해 주세요.";
    } catch (error) {
      resendMsgEl.textContent = error.code === "auth/too-many-requests" ? "잠시 뒤에 다시 눌러 주세요." : error.code;
    } finally {
      resendBtnEl.disabled = false;
    }
  });

  const googleLinkBtnEl = document.getElementById("google-link-btn");
  const googleLinkedEl = document.getElementById("google-linked");
  const googleLinkMsgEl = document.getElementById("google-link-msg");

  function showGoogleLinkState(user) {
    const linked = user.providerData.some((p) => p.providerId === "google.com");
    googleLinkBtnEl.style.display = linked ? "none" : "block";
    googleLinkedEl.style.display = linked ? "block" : "none";
  }

  googleLinkBtnEl.addEventListener("click", async () => {
    googleLinkMsgEl.textContent = "";
    googleLinkBtnEl.disabled = true;
    try {
      await linkWithPopup(auth.currentUser, new GoogleAuthProvider());
      googleLinkMsgEl.textContent = "Google 계정을 연결했어요.";
      showGoogleLinkState(auth.currentUser);
    } catch (error) {
      googleLinkMsgEl.textContent = error.code;
    } finally {
      googleLinkBtnEl.disabled = false;
    }
  });

  const db = getFirestore(auth.app);
  const ordersEl = document.getElementById("my-orders");
  let ordersUnsub = null;
  let ordersStopped = false;

  function renderOrders(docs) {
    ordersEl.textContent = "";
    if (!docs.length) {
      const empty = document.createElement("p");
      empty.style.cssText = "margin: 0; color: var(--sub);";
      empty.textContent = "아직 주문이 없습니다";
      ordersEl.append(empty);
      return;
    }
    const millis = (o) => (o.createdAt && o.createdAt.toMillis ? o.createdAt.toMillis() : Number.MAX_SAFE_INTEGER);
    const orders = docs.map((s) => ({ id: s.id, ...s.data() })).sort((a, b) => millis(b) - millis(a));
    orders.forEach((o) => {
      const card = document.createElement("div");
      card.style.cssText = "padding: 14px; background: var(--card); border-radius: 8px; margin-bottom: 10px; font-size: 14px;";
      const when = o.createdAt && o.createdAt.toDate
        ? o.createdAt.toDate().toLocaleString("ko-KR", { dateStyle: "medium", timeStyle: "short" })
        : "처리 중";
      const names = (o.items || []).map((i) => i.name).join(", ");
      const rows = [
        ["주문한 날", when],
        ["상품", names],
        ["합계", `${Number(o.totalPrice).toLocaleString("ko-KR")}원`],
        ["status", o.status]
      ];
      rows.forEach(([label, value]) => {
        const row = document.createElement("div");
        row.textContent = `${label}: ${value}`;
        card.append(row);
      });
      ordersEl.append(card);
    });
  }

  function startOrdersListener(user) {
    if (ordersUnsub || ordersStopped) return;
    const q = query(collection(db, "orders"), where("userId", "==", user.uid));
    ordersUnsub = onSnapshot(q, (snap) => {
      console.log(`[주문 알림] 주문 ${snap.size}건 (바뀐 문서 ${snap.docChanges().length}건)`);
      renderOrders(snap.docs);

      const allFinished = snap.docs.length > 0
        && snap.docs.every((s) => s.data().status === "delivered" || s.data().status === "canceled");
      if (allFinished) {
        ordersUnsub();
        ordersUnsub = null;
        ordersStopped = true;
        document.getElementById("orders-stopped").style.display = "block";
        console.log(`[그만 듣기] 주문 ${snap.docs.length}건이 모두 delivered 또는 canceled 라서 리스너를 해제했습니다`);
      }
    }, (error) => {
      console.error(`${error.code ? error.code + ": " : ""}${error.message}`);
      ordersEl.textContent = "내 주문을 불러오지 못했습니다";
    });
  }

  document.getElementById("orders-refresh").addEventListener("click", async (e) => {
    const btn = e.currentTarget;
    btn.disabled = true;
    try {
      const q = query(collection(db, "orders"), where("userId", "==", auth.currentUser.uid));
      const snap = await getDocs(q);
      renderOrders(snap.docs);
    } catch (error) {
      console.error(`${error.code ? error.code + ": " : ""}${error.message}`);
      ordersEl.textContent = "내 주문을 불러오지 못했습니다";
    } finally {
      btn.disabled = false;
    }
  });

  // 모든 화면의 헤더 업데이트
  window.authStateManager.onAuthStateChanged(async (user) => {
    if (user) {
      try { await user.reload(); } catch (e) {}
      // 로그인됨: 이메일 표시
      loadingEl.style.display = "none";
      contentEl.style.display = "block";
      emailDisplayEl.textContent = "계정: " + user.email;
      verifyBoxEl.style.display = user.emailVerified ? "none" : "block";
      showGoogleLinkState(user);
      startOrdersListener(user);

      logoutBtnEl.addEventListener("click", async () => {
        await signOut(auth);
        location.href = "index.html";
      });
    } else {
      if (ordersUnsub) {
        ordersUnsub();
        ordersUnsub = null;
      }
      // 로그인 안 됨: login.html로 리다이렉트
      location.href = "login.html?redirect=" + encodeURIComponent(location.href);
    }
  });
</script>
</body>
</html>
