<meta name="robots" content="noindex">

<style>
  .check-item { margin: 0 0 24px; }
  .check-result { margin: 12px 0 0; font-size: 14px; white-space: pre-wrap; word-break: break-all; }
  .check-result.ok { color: #2e7d32; }
  .check-result.denied { color: #b3402a; }
</style>

<header class="site"><div class="wrap">
  <a class="brand" href="index.html">GOAT상점</a>
  <nav class="site">
    <a href="index.html">상품</a>
    <a href="about.html">가게 소개</a>
    <a href="shipping.html">배송·교환</a>
    <a href="cart.html">장바구니<span class="cart-count">0</span></a>
  </nav>
</div></header>

<main><div class="wrap">
  <h2>규칙 확인 화면</h2>
  <p id="gate" class="lead">확인 중…</p>

  <div id="check-box" hidden>
    <p style="margin: 0 0 6px; word-break: break-all;">이메일: <span id="who-email"></span></p>
    <p style="margin: 0 0 24px; word-break: break-all;">UID: <span id="who-uid"></span></p>

    <div class="check-item">
      <button class="btn" id="read-orders">주문 전체 읽기</button>
      <p class="check-result" id="result-read"></p>
      <div id="table-box" style="overflow-x: auto;"></div>
    </div>

    <div class="check-item">
      <button class="btn" id="edit-my-order">내 주문 금액 고치기</button>
      <p class="check-result" id="result-edit"></p>
    </div>

    <div class="check-item">
      <button class="btn" id="zero-price">상품 가격 0원으로</button>
      <p class="check-result" id="result-zero"></p>
    </div>

    <div class="check-item">
      <button class="btn" id="ask-total">서버에게 금액 묻기</button>
      <p class="check-result" id="result-ask"></p>
    </div>

    <div class="check-item">
      <button class="btn" id="send-price">가격 바꿔 보내기</button>
      <p class="check-result" id="result-send"></p>
    </div>

    <div class="check-item">
      <button class="btn" id="zero-quantity">수량 0으로 묻기</button>
      <p class="check-result" id="result-zero-quantity"></p>
    </div>
  </div>
</div></main>

<footer class="site"><div class="wrap"></div></footer>
<script src="assets/shop.js"></script>
<script src="assets/app.js"></script>
<script type="module" src="assets/rules-check.js"></script>
</body>
</html>
