<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리 — GOAT상점</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="assets/style.css">

<!-- Google Tag Manager (noscript) -->

height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

<main><div class="wrap">
  <h2>관리 화면</h2>
  <p id="gate-status" style="margin: 20px 0;">확인하는 중…</p>
  <div id="gate-actions" style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px;"></div>
  <p id="gate-error" style="color: #c0392b; white-space: pre-wrap;"></p>
  <div id="admin-tabs" hidden style="margin-top: 24px; gap: 8px;">
    <button id="tab-products" type="button" aria-pressed="true">상품</button>
    <button id="tab-orders" type="button" aria-pressed="false">주문</button>
    <button id="tab-sales" type="button" aria-pressed="false" hidden>매출</button>
  </div>
  <div id="panel-products">
    <section id="product-admin" hidden style="margin-top: 24px;"></section>
    <section id="activity" hidden style="margin-top: 32px;">
      <h3>최근 활동</h3>
      <ul id="activity-list"></ul>
      <button id="activity-refresh" type="button">새로고침</button>
    </section>
  </div>
  <div id="panel-orders" hidden style="margin-top: 24px;">
    <label>상태 <select id="orders-status"></select></label>
    <p id="orders-msg" style="color: #c0392b;"></p>
    <ul id="orders-list" style="list-style: none; padding: 0;"></ul>
    <button id="orders-more" type="button" hidden>더 보기</button>
    <section id="order-detail" style="margin-top: 24px;"></section>
  </div>
  <div id="panel-sales" hidden style="margin-top: 24px;">
    <p id="sales-headline"></p>
    <p id="sales-msg" style="color: #c0392b;"></p>
    <div style="max-width: 720px;"><canvas id="sales-chart"></canvas></div>
    <div id="sales-table" style="margin-top: 16px;"></div>
  </div>
  <p style="margin-top: 24px;"><button id="recheck" type="button" hidden>다시 확인</button></p>
</div></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script type="module" src="assets/admin-gate.js"></script>
</body>
</html>
