  <div id="upload-box" style="max-width: 400px; margin: 30px 0;" hidden>
    <label for="product-select" style="display: block; font-size: 13px; color: var(--sub); margin: 0 0 6px;">상품</label>
    <select id="product-select" style="width: 100%; padding: 12px; margin-bottom: 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); font-family: inherit;"></select>

    <label for="image-file" style="display: block; font-size: 13px; color: var(--sub); margin: 0 0 6px;">사진 파일</label>
    <input type="file" id="image-file" accept="image/*" style="width: 100%; margin-bottom: 20px; color: var(--ink); font-family: inherit;">

    <button class="btn" id="upload-image">사진 올리기</button>
    <p id="upload-status" style="margin: 14px 0 0; color: var(--sub); white-space: pre-wrap;"></p>
  </div>
